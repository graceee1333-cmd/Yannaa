<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ken's Birthday Piano</title>
    <style>
        body {
            background-color: #2c3e50; /* Darker, elegant background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ecf0f1;
            font-family: sans-serif;
            overflow: hidden;
        }

        .flower {
            position: absolute;
            font-size: 20px;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        .guide-box {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .piano-wrapper {
            display: flex;
            overflow-x: auto;
            width: 90vw;
            height: 200px;
            background: #000;
            padding: 5px;
            border-radius: 5px;
        }

        .key {
            min-width: 30px;
            height: 100%;
            border: 1px solid #333;
            background: #fff;
            cursor: pointer;
        }

        .key.black {
            background: #000;
            min-width: 20px;
            margin: 0 -10px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="guide-box">
        <h1>Happy Birthday, Ken! 🎹</h1>
        <p>Pindutin ang mga keys. Guide: 0, 0, 2, 0, 5, 4</p>
    </div>

    <div class="piano-wrapper" id="piano"></div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playNote(freq) {
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        const piano = document.getElementById('piano');
        for (let i = 0; i < 81; i++) {
            const key = document.createElement('div');
            const isBlack = [1, 3, 6, 8, 10].includes(i % 12);
            key.className = 'key' + (isBlack ? ' black' : '');
            key.onclick = () => playNote(220 * Math.pow(1.059, i % 12));
            piano.appendChild(key);
        }

        // Flowers
        setInterval(() => {
            const f = document.createElement('div');
            f.innerHTML = '✿';
            f.className = 'flower';
            f.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 10000);
        }, 1000);
    </script>
</body>
</html>
