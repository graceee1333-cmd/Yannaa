<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Ken!</title>
    <style>
        body {
            background-color: #f4f1ea;
            color: #4a4a4a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .flower {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        .container { text-align: center; z-index: 10; margin-bottom: 20px; }
        
        /* Guide Box */
        .guide-box {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-weight: bold;
            color: #8d8778;
        }

        .piano-wrapper {
            width: 95%;
            max-width: 1000px;
            background: #dcd7c9;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: nowrap;
            z-index: 10;
        }

        .piano { display: inline-flex; }

        .key {
            width: 30px;
            height: 150px;
            border: 1px solid #b8b3a5;
            background: #fff;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 10px;
        }

        .key.black {
            background: #4a4a4a;
            width: 20px;
            margin-left: -10px;
            margin-right: -10px;
            z-index: 2;
        }

        .key:active { background: #e8e8e8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday, Ken</h1>
        <div class="guide-box" id="guide">
            Guide: Pindutin ang keys na may label na: <span style="color:#d81b60">0, 0, 2, 0, 5, 4</span>
        </div>
        <p id="status">Good luck!</p>
    </div>

    <div class="piano-wrapper">
        <div class="piano" id="piano"></div>
    </div>

    <script>
        // Floating Flowers
        function createFlower() {
            const f = document.createElement('div');
            f.innerHTML = '✿';
            f.className = 'flower';
            f.style.left = Math.random() * 100 + 'vw';
            f.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 10000);
        }
        setInterval(createFlower, 2000);

        // Piano Logic
        const piano = document.getElementById('piano');
        const status = document.getElementById('status');
        const melody = [0, 0, 2, 0, 5, 4];
        let progress = 0;

        for (let i = 0; i < 81; i++) {
            const key = document.createElement('div');
            const isBlack = [1, 3, 6, 8, 10].includes(i % 12);
            key.className = 'key' + (isBlack ? ' black' : '');
            if (!isBlack) key.innerText = i % 12; // Label para sa guide
            
            key.onclick = () => {
                if (i % 12 === melody[progress]) {
                    progress++;
                    status.innerText = "Nice! " + progress + "/" + melody.length;
                    if (progress === melody.length) {
                        alert("Happy Birthday, Ken! 🎉");
                        progress = 0;
                        status.innerText = "Ulitin natin? Good luck!";
                    }
                } else {
                    progress = 0;
                    status.innerText = "Mali! Simulan uli sa umpisa.";
                }
            };
            piano.appendChild(key);
        }
    </script>
</body>
</html>
